<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="50" fill="#f1f5f9"/>
  
  <!-- Gradiente para el fondo -->
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <circle cx="50" cy="50" r="50" fill="url(#avatarGradient)"/>
  
  <!-- Icono de usuario -->
  <g transform="translate(50, 50)">
    <!-- Cabeza -->
    <circle cx="0" cy="-8" r="12" fill="#6366f1" opacity="0.7"/>
    
    <!-- Cuerpo -->
    <path d="M -18 15 Q -18 5 -12 5 L 12 5 Q 18 5 18 15 L 18 25 L -18 25 Z" fill="#6366f1" opacity="0.7"/>
  </g>
  
  <!-- Borde sutil -->
  <circle cx="50" cy="50" r="49" fill="none" stroke="#e2e8f0" stroke-width="2"/>
</svg>