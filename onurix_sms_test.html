<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba Onurix SMS</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f6f7fb; margin: 0; padding: 24px; color: #222; }
        .card { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 20px; }
        h1 { font-size: 20px; margin: 0 0 12px; }
        p.sub { margin: 0 0 18px; color: #555; font-size: 14px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d7d9e0; border-radius: 8px; font-size: 14px; }
        textarea { min-height: 92px; resize: vertical; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        button { appearance: none; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-secondary { background: #eef2ff; color: #1e40af; }
        .result { margin-top: 18px; padding: 10px 12px; border-radius: 8px; font-size: 13px; background: #f9fafb; border: 1px solid #e5e7eb; white-space: pre-wrap; }
        .ok { border-color: #10b981; background: #ecfdf5; }
        .err { border-color: #ef4444; background: #fef2f2; }
        .hint { font-size: 12px; color: #666; margin-top: 8px; }
    </style>
    <script>
    async function sendSMS(ev) {
        ev.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const sms = document.getElementById('sms').value.trim();
        const resBox = document.getElementById('result');
        resBox.className = 'result';
        resBox.textContent = 'Enviando...';

        try {
            const resp = await fetch('onurix_sms_test.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, sms })
            });
            // Leer como texto y luego intentar parsear JSON para evitar usar await en callbacks no async
            const raw = await resp.text();
            let data;
            try {
                data = JSON.parse(raw);
            } catch (err) {
                data = { success: false, message: 'Respuesta inválida', raw };
            }
            if (data.success) {
                resBox.className = 'result ok';
            } else {
                resBox.className = 'result err';
            }
            resBox.textContent = JSON.stringify(data, null, 2);
        } catch (e) {
            resBox.className = 'result err';
            resBox.textContent = 'Error de red: ' + e.message;
        }
    }

    function fillExample() {
        document.getElementById('phone').value = '+573001234567';
        document.getElementById('sms').value = 'Mensaje de prueba desde tester Onurix.';
    }
    </script>
</head>
<body>
    <div class="card">
        <h1>Tester Onurix SMS</h1>
        <p class="sub">Formulario sencillo para enviar un SMS usando la API de Onurix (fuera del programa).</p>
        <form onsubmit="sendSMS(event)">
            <div class="form-group">
                <label for="phone">Número de teléfono (E.164)</label>
                <input id="phone" type="text" placeholder="Ej: +573001234567" required />
            </div>
            <div class="form-group">
                <label for="sms">Texto del mensaje</label>
                <textarea id="sms" placeholder="Escribe tu mensaje" required></textarea>
            </div>
            <div class="actions">
                <button class="btn-primary" type="submit">Enviar SMS</button>
                <button class="btn-secondary" type="button" onclick="fillExample()">Rellenar ejemplo</button>
            </div>
        </form>
        <div id="result" class="result" aria-live="polite"></div>
        <p class="hint">Nota: Las credenciales se definen en <code>onurix_sms_test.php</code>. Este archivo de prueba no usa la configuración del sistema.</p>
    </div>
</body>
</html>
